<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Button Link Example</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
    }

   https://github.com/Vaibhav-funde/UserManagementSystem.git
    .container {
        text-align: center;
        border: 2px solid black;
        border-radius: 10px;
        padding: 40px;
        width: 400px;
        margin: 100px auto;
        background-color: #ffffff;
        box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
    }

   
    .btn-link {
        display: inline-block;
        background-color: #4CAF50;
        color: white;
        padding: 12px 25px;
        margin: 10px;
        text-align: center;
        text-decoration: none;
        border-radius: 8px;
        font-size: 16px;
        transition: 0.3s;
        border: 1px solid #388E3C;
    }

    .btn-link:hover {
        background-color: #45a049;
        transform: scale(1.05);
    }

    h2 {
        
        color: #333;
        margin-bottom: 20px;
    }
</style>
</head>
<body>

<div class="container">
    <h2>User Management</h2>
    <a href="Register.jsp" class="btn-link">Registration</a><br>
    <a href="login.jsp" class="btn-link">Login</a><br>
    <a href="DashboardServlet" class="btn-link">DashBoard</a><br>
    <a href="StateCityC.jsp" class="btn-link">State & City CURD</a><br>
   
     

</div>

</body>
</html>
